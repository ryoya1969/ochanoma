<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書管理システム</title>
    <style>
        /* 見た目を整えるための簡単なCSS */
        body {
            font-family: sans-serif;
            margin: 20px;
            color: #333;
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .message {
            color: #666;
            margin-top: 20px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>図書室 蔵書一覧</h1>
    
    <div id="status-message" class="message">スプレッドシートからデータを読み込んでいます...</div>

    <table id="book-table" style="display: none;">
        <thead id="table-head">
            </thead>
        <tbody id="table-body">
            </tbody>
    </table>

    <script>
        // ★★★ここに先ほど発行したGASの「ウェブアプリのURL」を貼り付けてください★★★
        const gasUrl = "https://script.google.com/macros/s/AKfycbzzdnckjfPWdpQ7ElY85I5H_TUsoNSZih0lo7diumxISzXfwtcUybJBZKfnr0T6SULB/exec";

        // データを取得する処理
        fetch(gasUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('ネットワークの応答が正常ではありませんでした');
                }
                return response.json();
            })
            .then(data => {
                const statusMessage = document.getElementById('status-message');
                const table = document.getElementById('book-table');

                // データが空の場合の処理
                if (data.length === 0) {
                    statusMessage.innerText = "登録されている蔵書データがありません。";
                    return;
                }

                // 読み込み完了したらメッセージを消してテーブルを表示
                statusMessage.style.display = 'none';
                table.style.display = 'table';

                // 1. テーブルの見出し（1行目のキー）を生成
                const headers = Object.keys(data[0]);
                const thead = document.getElementById('table-head');
                let headerRow = '<tr>';
                headers.forEach(header => {
                    headerRow += `<th>${header}</th>`;
                });
                headerRow += '</tr>';
                thead.innerHTML = headerRow;

                // 2. テーブルのデータ（2行目以降）を生成
                const tbody = document.getElementById('table-body');
                let bodyRows = '';
                data.forEach(row => {
                    bodyRows += '<tr>';
                    headers.forEach(header => {
                        // データが空欄の場合は空白にする
                        const cellData = row[header] !== undefined ? row[header] : '';
                        bodyRows += `<td>${cellData}</td>`;
                    });
                    bodyRows += '</tr>';
                });
                tbody.innerHTML = bodyRows;
            })
            .catch(error => {
                console.error("エラーが発生しました:", error);
                const statusMessage = document.getElementById('status-message');
                statusMessage.className = "message error";
                statusMessage.innerText = "データの読み込みに失敗しました。GASのURLが正しいか、デプロイ設定が「全員」になっているか確認してください。";
            });
    </script>

</body>
</html>
